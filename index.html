<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JARVIS Fixed Multi-Tenant Matrix</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        deepspace: '#010309',
                        cyber: {
                            blue: '#00f3ff',
                            purple: '#a855f7',
                            glow: 'rgba(0, 243, 255, 0.4)'
                        }
                    },
                    boxShadow: {
                        'neon': '0 0 25px rgba(0, 243, 255, 0.35)',
                        'hud': '0 0 20px rgba(0, 243, 255, 0.25), inset 0 0 15px rgba(0, 243, 255, 0.2)'
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@500;700;900&display=swap');
        
        body, html {
            font-family: 'Share Tech Mono', monospace;
            background-color: #010309;
            color: #e2e8f0;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        .glow-text {
            text-shadow: 0 0 12px rgba(0, 243, 255, 0.8), 0 0 24px rgba(168, 85, 247, 0.5);
        }

        /* HUD Sci-Fi Framed Card */
        .hud-card {
            position: absolute;
            cursor: grab;
            background: rgba(2, 12, 27, 0.88);
            border: 1px solid rgba(0, 243, 255, 0.5);
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.2), inset 0 0 15px rgba(0, 243, 255, 0.1);
            clip-path: polygon(
                0 15px, 15px 0, 
                calc(100% - 15px) 0, 100% 15px, 
                100% calc(100% - 15px), calc(100% - 15px) 100%, 
                15px 100%, 0 calc(100% - 15px)
            );
            transition: box-shadow 0.3s, border-color 0.3s, transform 0.2s;
            touch-action: none;
        }
        .hud-card:active {
            cursor: grabbing;
        }
        .hud-card.focused {
            border-color: #a855f7 !important;
            box-shadow: 0 0 40px rgba(168, 85, 247, 0.6), inset 0 0 20px rgba(168, 85, 247, 0.3) !important;
            transform: translateZ(100px) scale(1.05);
        }

        .layer-tab {
            transition: all 0.3s ease;
            white-space: nowrap;
            flex-shrink: 0;
            clip-path: polygon(0 10px, 10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%);
        }
        .layer-tab.active {
            background: rgba(0, 243, 255, 0.3);
            border-color: #00f3ff;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
            color: #00f3ff;
        }

        #inspector-modal, #settings-modal {
            position: fixed;
            inset: 0;
            background: rgba(1, 3, 9, 0.92);
            backdrop-filter: blur(16px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        #inspector-modal.active, #settings-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        #trash-core-3d {
            position: absolute;
            bottom: -90px;
            right: -90px;
            width: 180px;
            height: 180px;
            border-radius: 100% 0 0 0;
            background: radial-gradient(circle at top left, rgba(239, 68, 68, 0.3), rgba(127, 29, 29, 0.6));
            border-top: 3px dashed rgba(239, 68, 68, 0.7);
            border-left: 3px dashed rgba(239, 68, 68, 0.7);
            display: flex;
            align-items: flex-end;
            justify-content: flex-end;
            padding: 25px;
            transform: translateZ(60px) translateY(90px) translateX(90px);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), background 0.3s;
            pointer-events: none;
            z-index: 50;
        }
        #trash-core-3d.active {
            transform: translateZ(60px) translateY(0) translateX(0);
            pointer-events: auto;
        }
        #trash-core-3d.hovered {
            background: radial-gradient(circle at top left, rgba(239, 68, 68, 0.6), rgba(185, 28, 28, 0.85));
            box-shadow: 0 0 50px rgba(239, 68, 68, 0.8);
            transform: translateZ(90px) translateY(0) translateX(0) scale(1.05);
        }

        @keyframes spin-fast {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .animate-spin-fast {
            animation: spin-fast 0.6s linear infinite;
        }

        .tabs-scroll::-webkit-scrollbar {
            height: 2px;
        }
        .tabs-scroll::-webkit-scrollbar-thumb {
            background: rgba(0, 243, 255, 0.4);
            border-radius: 2px;
        }
    </style>
    <!-- Firebase SDK (Web v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDIw2AQmLMXLJl...",
            authDomain: "kakeibo-6785e.firebaseapp.com",
            projectId: "kakeibo-6785e",
            storageBucket: "kakeibo-6785e.appspot.com",
            messagingSenderId: "401182986321",
            appId: "1:401182986321:web:xxxx"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.db = db;
        window.doc = doc;
        window.setDoc = setDoc;
        window.getDoc = getDoc;
        window.onSnapshot = onSnapshot;

        window.dispatchEvent(new Event('firebase-ready'));
    </script>
</head>
<body class="w-full h-full flex flex-col relative overflow-hidden">

    <!-- Central Core DNA Universe Background Canvas -->
    <canvas id="space-canvas" class="absolute inset-0 w-full h-full pointer-events-none z-0"></canvas>

    <!-- Header & Navigation -->
    <header class="absolute top-0 left-0 right-0 z-40 px-3 py-2 flex flex-col border-b border-cyan-500/30 bg-[#010309]/95 backdrop-blur-md pointer-events-none gap-1.5 shadow-[0_4px_20px_rgba(0,243,255,0.15)]">
        <div class="flex items-center justify-between w-full pointer-events-auto">
            <div class="flex items-center space-x-2">
                <div class="w-2 h-2 bg-cyan-400 rounded-full animate-ping shadow-[0_0_10px_#00f3ff]"></div>
                <h1 class="font-orbitron font-black text-[11px] md:text-xs tracking-wider text-cyan-400 glow-text">J.A.R.V.I.S. // SECURE ROOM</h1>
            </div>
            
            <div class="flex items-center space-x-2">
                <button id="force-sync-btn" onclick="forceManualSync()" class="bg-cyan-500/25 hover:bg-cyan-500/40 border border-cyan-500/60 text-cyan-300 px-2.5 py-1 rounded text-[10px] font-bold font-orbitron cursor-pointer flex items-center gap-1 transition-all shadow-[0_0_10px_rgba(0,243,255,0.3)]">
                    <svg id="sync-icon" class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    <span>SYNC</span>
                </button>
                <button id="open-settings-btn" class="bg-purple-500/25 hover:bg-purple-500/40 border border-purple-500/60 text-purple-300 px-2.5 py-1 rounded text-[10px] font-bold font-orbitron cursor-pointer shadow-[0_0_10px_rgba(168,85,247,0.3)]">SETTING</button>
            </div>
        </div>
        
        <!-- Folder Tabs -->
        <div id="tabs-container" class="flex items-center space-x-1.5 pointer-events-auto overflow-x-auto tabs-scroll w-full py-1"></div>
    </header>

    <!-- Workspace -->
    <main id="workspace-3d" class="relative flex-1 w-full h-full overflow-hidden z-10 pt-16">
        <div id="nodes-layer" class="absolute inset-0 z-30 pointer-events-none"></div>
    </main>

    <!-- Settings Modal -->
    <div id="settings-modal">
        <div class="bg-black/95 border border-cyan-500 p-5 rounded-2xl max-w-md w-full mx-3 shadow-[0_0_50px_rgba(0,243,255,0.35)] relative">
            <div class="flex justify-between items-center mb-3 border-b border-cyan-500/30 pb-2">
                <h2 class="font-orbitron font-bold text-xs text-cyan-200">SETTINGS & DEPLOY HUB</h2>
                <button id="settings-close" class="text-slate-400 hover:text-cyan-300 text-lg font-bold p-1 cursor-pointer">✕</button>
            </div>
            <div class="space-y-4 text-xs text-cyan-100 font-mono">
                <div>
                    <span class="text-cyan-300 block mb-1 font-bold">■ タスク / プロトコル展開:</span>
                    <div class="flex gap-2">
                        <input type="text" id="modal-task-input" placeholder="Type new 3D task..." class="flex-1 bg-slate-950 border border-cyan-500/40 px-2.5 py-1.5 rounded text-xs text-cyan-200 focus:outline-none">
                        <button id="modal-deploy-btn" class="bg-cyan-500/20 border border-cyan-500 text-cyan-300 px-3 py-1.5 rounded font-bold cursor-pointer whitespace-nowrap">+ DEPLOY</button>
                    </div>
                </div>
                <hr class="border-cyan-500/20 my-1">
                <div>
                    <span class="text-cyan-300 block mb-1 font-bold">■ 部屋の合言葉 (GROUP ID):</span>
                    <p class="text-[10px] text-slate-400 mb-1">別の合言葉を入力して「部屋移動」を押すと、独立した別空間にジャンプします。</p>
                    <div class="flex gap-2">
                        <input type="text" id="group-id-input" placeholder="例: enfp-infra-room" class="flex-1 bg-slate-950 border border-cyan-500/40 px-2.5 py-1.5 rounded text-xs text-cyan-200 focus:outline-none">
                        <button id="save-group-btn" class="bg-purple-500/20 border border-purple-500 text-purple-300 px-3 py-1.5 rounded font-bold cursor-pointer">部屋移動</button>
                    </div>
                </div>
                <hr class="border-cyan-500/20 my-1">
                <div>
                    <span class="text-cyan-300 block mb-1 font-bold">■ 新規フォルダ作成:</span>
                    <div class="flex gap-2">
                        <input type="text" id="new-folder-name" placeholder="Folder name (e.g. 04: KUBERNETES)" class="flex-1 bg-slate-950 border border-cyan-500/40 px-2.5 py-1.5 rounded text-xs text-cyan-200 focus:outline-none">
                        <button id="create-folder-btn" class="bg-cyan-500/20 border border-cyan-500 text-cyan-300 px-3 py-1.5 rounded font-bold cursor-pointer">CREATE</button>
                    </div>
                </div>
                <div>
                    <span class="text-cyan-300 block mb-1 font-bold">■ 既存フォルダ管理:</span>
                    <div id="folder-list-edit" class="space-y-2 max-h-28 overflow-y-auto pr-1"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Task Detail Modal -->
    <div id="inspector-modal">
        <div class="bg-black/95 border border-purple-500 p-5 rounded-2xl max-w-lg w-full mx-3 shadow-[0_0_50px_rgba(168,85,247,0.4)] relative">
            <div class="flex justify-between items-center mb-3 border-b border-purple-500/30 pb-2">
                <div>
                    <span id="modal-category" class="text-[9px] px-2 py-0.5 rounded bg-purple-950 border border-purple-500/50 text-purple-300 font-orbitron">INFRA</span>
                    <h2 id="modal-title" class="font-orbitron font-bold text-xs md:text-sm text-purple-200 mt-1">TASK INSPECTOR</h2>
                </div>
                <button id="modal-close" class="text-slate-400 hover:text-purple-300 text-lg font-bold p-1 cursor-pointer">✕</button>
            </div>
            <div class="space-y-3 text-xs text-cyan-100 font-mono">
                <div>
                    <span class="text-slate-400 block mb-1">■ MOVE TO FOLDER:</span>
                    <select id="modal-folder-select" class="w-full bg-slate-950 border border-purple-500/40 px-2.5 py-1.5 rounded text-xs text-cyan-200 focus:outline-none"></select>
                </div>
                <div>
                    <span class="text-slate-400 block mb-1">■ ARCHITECTURE DESIGN MEMO:</span>
                    <textarea id="modal-memo" class="w-full h-20 bg-slate-950 border border-purple-500/40 p-2.5 rounded text-xs text-cyan-200 focus:outline-none resize-none" placeholder="Enter architecture memo or script notes..."></textarea>
                </div>
                <div class="flex justify-between items-center pt-2 border-t border-purple-500/20 text-[10px]">
                    <span class="text-purple-400 font-bold">● CLOUD AUTO-SYNC</span>
                    <button id="modal-save" class="bg-purple-500/20 border border-purple-500 text-purple-300 px-3.5 py-1.5 rounded transition font-bold cursor-pointer">SAVE & SYNC</button>
                </div>
            </div>
        </div>
    </div>

    <div id="trash-core-3d">
        <div class="text-right flex flex-col items-end">
            <span class="text-red-400 text-base mb-0.5">🗑️</span>
            <span class="font-orbitron text-[8px] text-red-300 font-bold tracking-widest">DISPOSE</span>
        </div>
    </div>

    <!-- Application & Multi-Tenant Routing Script -->
    <script>
        let defaultLayers = [
            {
                name: '01: WORK',
                tasks: [
                    { id: 101, title: 'AWS マルチAZ VPCネットワーク設計', category: 'AWS', x: window.innerWidth * 0.05, y: window.innerHeight * 0.3, z: 50, color: 'border-cyan-400 text-cyan-300', memo: 'VPCピアリングとサブネット設計。' },
                    { id: 102, title: 'EC2オートスケーリング最適化', category: 'AWS', x: window.innerWidth * 0.4, y: window.innerHeight * 0.45, z: 70, color: 'border-cyan-400 text-cyan-300', memo: 'インスタンス選定と負荷分散。' }
                ]
            },
            {
                name: '02: PRIVATE',
                tasks: [
                    { id: 201, title: 'Boto3リソース自動監視スクリプト', category: 'PYTHON', x: window.innerWidth * 0.08, y: window.innerHeight * 0.35, z: 40, color: 'border-purple-400 text-purple-300', memo: '未アタッチEBS検知とSlack通知。' }
                ]
            },
            {
                name: '03: TO DO LIST',
                tasks: [
                    { id: 301, title: 'Terraformモジュールリファクタリング', category: 'IAC', x: window.innerWidth * 0.1, y: window.innerHeight * 0.35, z: 60, color: 'border-emerald-400 text-emerald-300', memo: 'ディレクトリ構造の再設計。' }
                ]
            }
        ];

        let layers = JSON.parse(JSON.stringify(defaultLayers));
        let currentLayerIndex = 0;
        let currentActiveTaskId = null;
        let currentGroupId = localStorage.getItem('jarvis_matrix_group_id') || 'default-matrix-room';
        let unsubscribeSnapshot = null;
        let isSyncing = false;

        const workspace3D = document.getElementById('workspace-3d');
        const nodesLayer = document.getElementById('nodes-layer');
        const trashCore3D = document.getElementById('trash-core-3d');
        const inspectorModal = document.getElementById('inspector-modal');
        const settingsModal = document.getElementById('settings-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalCategory = document.getElementById('modal-category');
        const modalMemo = document.getElementById('modal-memo');
        const modalFolderSelect = document.getElementById('modal-folder-select');
        const tabsContainer = document.getElementById('tabs-container');
        const folderListEdit = document.getElementById('folder-list-edit');
        const groupIdInput = document.getElementById('group-id-input');
        const modalTaskInput = document.getElementById('modal-task-input');
        const syncIcon = document.getElementById('sync-icon');

        groupIdInput.value = currentGroupId;

        window.addEventListener('firebase-ready', () => {
            initFirebaseListeners();
        });

        setTimeout(() => {
            if (window.db && !unsubscribeSnapshot) {
                initFirebaseListeners();
            }
        }, 1000);

        function getDocRef() {
            return window.doc(window.db, "groups", currentGroupId, "matrix_state", "main");
        }

        async function saveToCloud() {
            if (!window.db || isSyncing) return;
            isSyncing = true;
            try {
                await window.setDoc(getDocRef(), { layers, updatedAt: Date.now() });
            } catch (err) {
                console.error("Cloud save error:", err);
            } finally {
                isSyncing = false;
            }
        }

        function initFirebaseListeners() {
            if (!window.db) return;
            
            if (unsubscribeSnapshot) {
                unsubscribeSnapshot();
                unsubscribeSnapshot = null;
            }

            syncIcon.classList.add('animate-spin-fast');

            unsubscribeSnapshot = window.onSnapshot(getDocRef(), (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (data && data.layers && Array.isArray(data.layers) && data.layers.length > 0) {
                        layers = data.layers;
                        if (currentLayerIndex >= layers.length) currentLayerIndex = 0;
                    }
                } else {
                    saveToCloud();
                }
                renderTabs();
                renderNodes();
                syncIcon.classList.remove('animate-spin-fast');
            }, (error) => {
                console.error("Snapshot error:", error);
                syncIcon.classList.remove('animate-spin-fast');
                renderTabs();
                renderNodes();
            });
        }

        window.forceManualSync = async function() {
            if (!window.db) return;
            syncIcon.classList.add('animate-spin-fast');
            try {
                const docSnap = await window.getDoc(getDocRef());
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (data && data.layers && Array.isArray(data.layers) && data.layers.length > 0) {
                        layers = data.layers;
                        if (currentLayerIndex >= layers.length) currentLayerIndex = 0;
                        renderTabs();
                        renderNodes();
                    }
                }
            } catch (err) {
                console.error("Manual sync error:", err);
            } finally {
                setTimeout(() => {
                    syncIcon.classList.remove('animate-spin-fast');
                }, 400);
            }
        }

        document.getElementById('save-group-btn').addEventListener('click', () => {
            const newGroupId = groupIdInput.value.trim().toLowerCase();
            if (!newGroupId) return;
            if (newGroupId === currentGroupId) {
                settingsModal.classList.remove('active');
                return;
            }

            currentGroupId = newGroupId;
            localStorage.setItem('jarvis_matrix_group_id', currentGroupId);
            settingsModal.classList.remove('active');
            
            layers = JSON.parse(JSON.stringify(defaultLayers));
            currentLayerIndex = 0;
            
            initFirebaseListeners();
        });

        document.getElementById('open-settings-btn').addEventListener('click', () => { renderFolderEditList(); settingsModal.classList.add('active'); });
        document.getElementById('settings-close').addEventListener('click', () => settingsModal.classList.remove('active'));

        document.getElementById('create-folder-btn').addEventListener('click', () => {
            const input = document.getElementById('new-folder-name');
            const name = input.value.trim();
            if (!name) return;
            layers.push({ name, tasks: [] });
            input.value = '';
            renderTabs();
            renderFolderEditList();
            switchLayer(layers.length - 1);
            settingsModal.classList.remove('active');
            saveToCloud();
        });

        document.getElementById('modal-deploy-btn').addEventListener('click', addNewTask);
        modalTaskInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') addNewTask(); });

        function addNewTask() {
            const title = modalTaskInput.value.trim();
            if (!title) return;
            const currentLayer = layers[currentLayerIndex];
            currentLayer.tasks.push({
                id: Date.now(),
                title,
                category: currentLayer.name,
                x: window.innerWidth * 0.1 + Math.random() * 40,
                y: window.innerHeight * 0.38 + Math.random() * 40,
                z: Math.random() * 40 + 20,
                color: currentLayerIndex % 2 === 0 ? 'border-cyan-400 text-cyan-300' : 'border-purple-400 text-purple-300',
                memo: `[${currentLayer.name}] 自動化プロトコル。`
            });
            modalTaskInput.value = '';
            settingsModal.classList.remove('active');
            renderNodes();
            saveToCloud();
        }

        window.deleteFolder = function(idx) {
            if (layers.length <= 1) {
                alert('少なくとも1つのフォルダが必要です。');
                return;
            }
            layers.splice(idx, 1);
            if (currentLayerIndex >= layers.length) currentLayerIndex = layers.length - 1;
            renderTabs();
            renderFolderEditList();
            switchLayer(currentLayerIndex);
            saveToCloud();
        }

        function renderFolderEditList() {
            folderListEdit.innerHTML = '';
            layers.forEach((layer, idx) => {
                const row = document.createElement('div');
                row.className = 'flex items-center gap-2 bg-slate-900 p-2 rounded border border-cyan-500/20';
                row.innerHTML = `
                    <input type="text" value="${layer.name}" data-index="${idx}" class="folder-name-input flex-1 bg-black border border-cyan-500/30 px-2 py-1 rounded text-xs text-cyan-200 focus:outline-none">
                    <button onclick="deleteFolder(${idx})" class="text-red-400 text-xs px-2 py-1 bg-red-950/40 rounded border border-red-500/30 cursor-pointer">DELETE</button>
                `;
                folderListEdit.appendChild(row);
            });

            document.querySelectorAll('.folder-name-input').forEach(input => {
                input.addEventListener('input', (e) => {
                    const idx = parseInt(e.target.getAttribute('data-index'));
                    layers[idx].name = e.target.value;
                    renderTabs();
                    saveToCloud();
                });
            });
        }

        function renderTabs() {
            tabsContainer.innerHTML = '';
            layers.forEach((layer, idx) => {
                const btn = document.createElement('button');
                btn.id = `tab-${idx}`;
                btn.className = `layer-tab px-3 py-1.5 bg-black/80 border border-cyan-500/30 rounded text-[11px] text-slate-300 font-orbitron cursor-pointer ${idx === currentLayerIndex ? 'active' : ''}`;
                btn.innerText = layer.name;
                btn.onclick = () => switchLayer(idx);
                tabsContainer.appendChild(btn);
            });
        }

        let touchStartX = 0;
        window.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) touchStartX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
        });
        window.addEventListener('touchend', (e) => {
            if (e.changedTouches.length >= 1 && touchStartX !== 0) {
                let diffX = e.changedTouches[0].clientX - touchStartX;
                if (Math.abs(diffX) > 60) {
                    let nextIdx = diffX > 0 ? (currentLayerIndex - 1 + layers.length) % layers.length : (currentLayerIndex + 1) % layers.length;
                    switchLayer(nextIdx);
                    touchStartX = 0;
                }
            }
        });

        window.switchLayer = function(index) {
            currentLayerIndex = index;
            renderTabs();
            workspace3D.style.transform = `translateZ(-200px) rotateY(${(index - 1) * 10}deg)`;
            setTimeout(() => {
                workspace3D.style.transform = `rotateX(0deg) rotateY(0deg)`;
                renderNodes();
            }, 300);
        }

        document.getElementById('modal-close').addEventListener('click', () => { inspectorModal.classList.remove('active'); renderNodes(); });
        document.getElementById('modal-save').addEventListener('click', () => {
            if (currentActiveTaskId !== null) {
                const activeTasks = layers[currentLayerIndex].tasks;
                const taskIndex = activeTasks.findIndex(t => t.id === currentActiveTaskId);
                if (taskIndex !== -1) {
                    const task = activeTasks[taskIndex];
                    task.memo = modalMemo.value;
                    const targetFolderIdx = parseInt(modalFolderSelect.value);
                    if (targetFolderIdx !== currentLayerIndex) {
                        activeTasks.splice(taskIndex, 1);
                        layers[targetFolderIdx].tasks.push(task);
                    }
                    renderNodes();
                    saveToCloud();
                }
            }
            inspectorModal.classList.remove('active');
        });

        // --- Central Core DNA Helix & Deep Universe Background Animation ---
        const spaceCanvas = document.getElementById('space-canvas');
        const sCtx = spaceCanvas.getContext('2d');
        function resizeCanvas() { 
            spaceCanvas.width = window.innerWidth; 
            spaceCanvas.height = window.innerHeight; 
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let mouseX = 0, mouseY = 0;
        window.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth - 0.5) * 8;
            mouseY = (e.clientY / window.innerHeight - 0.5) * 8;
            workspace3D.style.transform = `rotateX(${-mouseY}deg) rotateY(${mouseX}deg)`;
        });

        let stars = Array.from({length: 80}, () => ({
            x: (Math.random() - 0.5) * window.innerWidth * 2,
            y: (Math.random() - 0.5) * window.innerHeight * 2,
            z: Math.random() * 500 - 250,
            size: Math.random() * 1.2,
            speedZ: 0.08,
            color: Math.random() > 0.5 ? 'rgba(0, 243, 255, 0.6)' : 'rgba(168, 85, 247, 0.6)'
        }));

        let dnaAngle = 0;

        function render3DSpace() {
            sCtx.clearRect(0, 0, spaceCanvas.width, spaceCanvas.height);
            const cx = spaceCanvas.width / 2;
            const cy = spaceCanvas.height / 2;

            const bgGrad = sCtx.createRadialGradient(cx, cy, 30, cx, cy, Math.max(cx, cy) * 1.2);
            bgGrad.addColorStop(0, '#041538'); 
            bgGrad.addColorStop(0.5, '#01091f');
            bgGrad.addColorStop(1, '#010309');
            sCtx.fillStyle = bgGrad; 
            sCtx.fillRect(0, 0, spaceCanvas.width, spaceCanvas.height);

            stars.forEach(p => {
                p.z -= p.speedZ; if (p.z < -250) p.z = 250;
                let scale = 300 / (300 + p.z);
                let x2d = cx + p.x * scale;
                let y2d = cy + p.y * scale;
                sCtx.fillStyle = p.color;
                sCtx.beginPath(); sCtx.arc(x2d, y2d, p.size * scale, 0, Math.PI * 2); sCtx.fill();
            });

            dnaAngle += 0.02;
            const dnaLength = 22;
            const stepY = 14;
            const helixRadius = 45;

            sCtx.save();
            sCtx.translate(cx, cy - 20);

            const coreGlow = sCtx.createRadialGradient(0, 0, 10, 0, 0, 180);
            coreGlow.addColorStop(0, 'rgba(0, 243, 255, 0.35)');
            coreGlow.addColorStop(0.5, 'rgba(168, 85, 247, 0.15)');
            coreGlow.addColorStop(1, 'transparent');
            sCtx.fillStyle = coreGlow;
            sCtx.beginPath();
            sCtx.arc(0, 0, 180, 0, Math.PI * 2);
            sCtx.fill();

            for (let i = 0; i < dnaLength; i++) {
                let yOffset = (i - dnaLength / 2) * stepY;
                let currentAngle = dnaAngle + i * 0.3;

                let x1 = Math.cos(currentAngle) * helixRadius;
                let z1 = Math.sin(currentAngle);
                let x2 = Math.cos(currentAngle + Math.PI) * helixRadius;
                let z2 = Math.sin(currentAngle + Math.PI);

                sCtx.strokeStyle = 'rgba(0, 243, 255, 0.35)';
                sCtx.lineWidth = 1.2;
                sCtx.beginPath();
                sCtx.moveTo(x1, yOffset);
                sCtx.lineTo(x2, yOffset);
                sCtx.stroke();

                sCtx.fillStyle = z1 > 0 ? '#00f3ff' : 'rgba(0, 243, 255, 0.4)';
                sCtx.beginPath();
                sCtx.arc(x1, yOffset, z1 > 0 ? 4 : 2.5, 0, Math.PI * 2);
                sCtx.fill();

                sCtx.fillStyle = z2 > 0 ? '#a855f7' : 'rgba(168, 85, 247, 0.4)';
                sCtx.beginPath();
                sCtx.arc(x2, yOffset, z2 > 0 ? 4 : 2.5, 0, Math.PI * 2);
                sCtx.fill();
            }
            sCtx.restore();

            requestAnimationFrame(render3DSpace);
        }
        render3DSpace();

        function targetZoomAndInspect(taskId) {
            const activeTasks = layers[currentLayerIndex].tasks;
            const task = activeTasks.find(t => t.id === taskId);
            if (!task) return;
            currentActiveTaskId = task.id;

            document.querySelectorAll('.hud-card').forEach(el => {
                if (parseInt(el.getAttribute('data-id')) === taskId) el.classList.add('focused');
                else el.classList.remove('focused');
            });

            modalTitle.innerText = task.title;
            modalCategory.innerText = layers[currentLayerIndex].name;
            modalMemo.value = task.memo || '';

            modalFolderSelect.innerHTML = '';
            layers.forEach((layer, idx) => {
                const opt = document.createElement('option');
                opt.value = idx; opt.innerText = layer.name;
                if (idx === currentLayerIndex) opt.selected = true;
                modalFolderSelect.appendChild(opt);
            });
            
            setTimeout(() => inspectorModal.classList.add('active'), 200);
        }

        let activeDragId = null;
        let offsetX = 0, offsetY = 0;

        function renderNodes() {
            nodesLayer.innerHTML = '';
            const activeLayer = layers[currentLayerIndex];
            if (!activeLayer || !activeLayer.tasks) return;

            activeLayer.tasks.forEach(task => {
                const node = document.createElement('div');
                node.className = `hud-card pointer-events-auto p-4 w-72 md:w-96 select-none ${currentActiveTaskId === task.id ? 'focused' : ''}`;
                node.style.left = `${Math.min(task.x, window.innerWidth - 300)}px`;
                node.style.top = `${Math.min(task.y, window.innerHeight - 200)}px`;
                node.style.transform = `translateZ(${task.z}px)`;
                node.setAttribute('data-id', task.id);

                node.innerHTML = `
                    <div class="flex justify-between items-center mb-2 border-b border-cyan-500/30 pb-1">
                        <span class="text-[9px] px-2 py-0.5 rounded bg-cyan-950/80 border border-cyan-500/40 text-cyan-400 font-orbitron">${activeLayer.name}</span>
                        <span class="text-[11px] text-purple-300 cursor-pointer hover:underline inspect-btn font-bold font-orbitron" data-id="${task.id}">OPEN</span>
                    </div>
                    <div class="text-sm md:text-base font-bold text-cyan-100 mb-3 leading-snug">${task.title}</div>
                    <div class="flex justify-between items-center text-[10px] text-slate-400 border-t border-cyan-500/20 pt-2 font-mono">
                        <span class="text-emerald-400 font-bold">● ROOM SYNCED</span>
                        <span class="hover:text-red-400 cursor-pointer delete-icon font-bold" data-id="${task.id}">[DISPOSE]</span>
                    </div>
                `;

                node.addEventListener('dblclick', () => targetZoomAndInspect(task.id));
                node.querySelector('.inspect-btn').addEventListener('click', (e) => { e.stopPropagation(); targetZoomAndInspect(task.id); });

                node.addEventListener('pointerdown', (e) => {
                    activeDragId = task.id;
                    const rect = node.getBoundingClientRect();
                    offsetX = e.clientX - rect.left;
                    offsetY = e.clientY - rect.top;
                    node.style.zIndex = 100;
                    node.setPointerCapture(e.pointerId);
                    trashCore3D.classList.add('active');
                });

                node.addEventListener('pointermove', (e) => {
                    if (activeDragId !== task.id) return;
                    let newX = e.clientX - offsetX;
                    let newY = e.clientY - offsetY;
                    task.x = Math.max(10, Math.min(window.innerWidth - 300, newX));
                    task.y = Math.max(90, Math.min(window.innerHeight - 160, newY));
                    node.style.left = `${task.x}px`;
                    node.style.top = `${task.y}px`;

                    const trashRect = trashCore3D.getBoundingClientRect();
                    if (e.clientX >= trashRect.left && e.clientY >= trashRect.top) trashCore3D.classList.add('hovered');
                    else trashCore3D.classList.remove('hovered');
                });

                node.addEventListener('pointerup', (e) => {
                    if (activeDragId !== null) {
                        const trashRect = trashCore3D.getBoundingClientRect();
                        if (e.clientX >= trashRect.left && e.clientY >= trashRect.top) {
                            activeLayer.tasks = activeLayer.tasks.filter(t => t.id !== activeDragId);
                            renderNodes();
                            saveToCloud();
                        }
                        activeDragId = null;
                        node.style.zIndex = 30;
                        trashCore3D.classList.remove('active', 'hovered');
                    }
                });

                nodesLayer.appendChild(node);
            });

            document.querySelectorAll('.delete-icon').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = parseInt(e.target.getAttribute('data-id'));
                    layers[currentLayerIndex].tasks = layers[currentLayerIndex].tasks.filter(t => t.id !== id);
                    renderNodes();
                    saveToCloud();
                });
            });
        }
    </script>
</body>
</html>
